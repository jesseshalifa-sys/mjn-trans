<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MJN Facilitating Resource | Namungoona Salaf S4 to A-Level Transition 2026</title>
<style>
:root{
 --navy:#14213d;--navy2:#1d3157;--teal:#0f9d8a;--teal-dark:#087f70;
 --mint:#e7f7f3;--sky:#edf4ff;--gold:#f4b942;--rose:#ffeceb;
 --ink:#1d2939;--muted:#667085;--line:#e4eaf1;--surface:#ffffff;--bg:#f4f7fb;
 --shadow:0 8px 24px rgba(20,33,61,.06)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
header{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:22px 16px;position:fixed;inset:0 auto 0 0;width:248px;z-index:10;box-shadow:8px 0 30px rgba(20,33,61,.08);overflow-y:auto}
header>b{display:block;font-size:15px;line-height:1.45;letter-spacing:.1px;padding:0 8px 20px;border-bottom:1px solid rgba(255,255,255,.14)}
header nav{display:flex;flex-direction:column;gap:6px;margin-top:18px}
header a{color:#dce7f7;text-decoration:none;font-size:13px;font-weight:600;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;transition:background .18s,color .18s}
header a:hover,header a:focus{background:rgba(255,255,255,.12);color:#fff;outline:none}
header a[href="#dashboard"]{background:rgba(15,157,138,.22);color:#fff}
main{max-width:1400px;margin:0 0 0 248px;padding:30px clamp(16px,3vw,42px) 48px}
h1{font-size:clamp(23px,2.2vw,30px);letter-spacing:-.7px;line-height:1.2;margin:4px 0 8px;font-weight:800;color:var(--navy)}
h2{font-size:17px;letter-spacing:-.2px;margin:22px 0 10px;color:var(--navy);font-weight:750}
h4{margin:18px 0 8px;font-size:14px;color:var(--navy);font-weight:750}
p{margin:8px 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:20px 0}
.k{background:linear-gradient(145deg,#fff,#f9fbff);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:100px}
.k:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--teal)}
.k b{font-size:28px;line-height:1.2;display:block;color:var(--navy);margin-bottom:8px;letter-spacing:-.8px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0 16px}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;font-size:13px;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}
th{background:#edf3fb;color:#263b5c;font-size:11px;text-transform:uppercase;letter-spacing:.55px;font-weight:800;white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:#f8fbff}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d3dce8;border-radius:9px;font:inherit;background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,157,138,.13)}
label{display:block;margin:13px 0 5px;font-weight:700;font-size:12px;color:#344054}
.opt{display:inline-flex;align-items:center;gap:7px;margin:5px 12px 5px 0;font-weight:500;color:var(--ink)}
.opt input{width:auto;accent-color:var(--teal)}
.btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 15px;font:inherit;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin:3px 4px 3px 0;box-shadow:0 3px 8px rgba(15,157,138,.12);transition:transform .15s,background .15s}
.btn:hover{background:var(--teal-dark);transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--navy);border:1px solid #d7e0eb;box-shadow:none}
.btn.alt:hover{background:var(--sky)}
.btn.red{background:#c93636;color:#fff}
.flash{padding:12px 15px;border-radius:10px;margin:8px 0 16px;background:var(--mint);color:#086c5e;border:1px solid #c9eee5;font-weight:600}
.flash.error{background:var(--rose);color:#a12727;border-color:#f7d0ce}
.bar{background:#e7edf5;border-radius:99px;height:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;background:linear-gradient(90deg,var(--teal),#54c7b6);height:9px;border-radius:99px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.muted{color:var(--muted);font-size:12px}
a{color:#087f70}
form.card{max-width:1100px}

.brand-logo{display:block;width:100%;max-width:205px;height:88px;object-fit:contain;object-position:left center;margin:0 auto 12px;background:#fff;border-radius:12px;padding:5px}
header>b{font-size:14px}
header .brand-name{display:block;font-size:13px;line-height:1.3;letter-spacing:.7px;color:#fff;font-weight:800}
header .brand-sub{display:block;font-size:11px;font-weight:500;color:#c9d8ee;margin-top:5px}
main h1{color:var(--navy)}
@media(max-width:760px){.brand-logo{width:150px;height:60px;object-position:left center;margin:0 0 8px}header>b{display:flex;align-items:center;gap:10px}header .brand-name{font-size:12px}}
\n@media(max-width:760px){
 header{position:sticky;inset:auto;width:100%;padding:14px 14px 10px;box-shadow:0 5px 20px rgba(20,33,61,.12)}
 header>b{font-size:14px;padding:0 4px 10px}
 header nav{flex-direction:row;gap:5px;margin-top:10px;overflow-x:auto;padding-bottom:3px}
 header a{white-space:nowrap;padding:8px 10px;font-size:12px;background:rgba(255,255,255,.06)}
 main{margin:0;padding:20px 14px 34px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .k{padding:14px;min-height:90px}.k b{font-size:24px}
 .card{padding:15px;border-radius:13px}
 h1{font-size:24px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}.row>*{min-width:100%}}
@media print{header,.noprint{display:none!important}body{background:#fff}main{max-width:none;margin:0;padding:0}.card{border:0;box-shadow:none;padding:0;break-inside:avoid}table{min-width:0;font-size:10px}th,td{padding:4px;border:1px solid #ddd}}
</style></head><body>

  return {learners:[],nextId:1,settings:{expected:252,target:150}};}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true;}
  catch(e){alert("Could not save (browser storage blocked or full). Download a backup now.");return false;}}

/* ---------- staff PIN (deterrent lock, see notes) ---------- */
let STAFF=false;
function hashPin(str){str="salaf|"+str;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function needStaff(){if(STAFF)return true;alert("Staff PIN required. Open Follow-up or Settings and unlock first.");return false;}
function lockNow(){STAFF=false;showContacts=false;if(location.hash==="#dashboard"||!location.hash)render();else location.hash="#dashboard";}
function lockView(){const has=!!DB.settings.pinHash;
  return `<div class="card" style="max-width:380px;margin:30px auto"><h1>Staff only</h1><p class="muted">This section holds parent contact details and follow-up records. Enter the staff PIN to continue.</p>
  <form onsubmit="return unlock(event)"><label>${has?"Staff PIN":"No PIN set yet. Create a staff PIN (at least 4 characters)"}</label><input id="pin" type="password" autocomplete="off" required>
  ${has?"":'<label>Repeat PIN</label><input id="pin2" type="password" autocomplete="off" required>'}
  <p><button class="btn">${has?"Unlock":"Set PIN and unlock"}</button></p></form></div>`;}
function unlock(e){e.preventDefault();const p=$("#pin").value;
  if(DB.settings.pinHash){if(hashPin(p)!==DB.settings.pinHash){alert("Wrong PIN.");return false;}}
  else{if(p.length<4){alert("PIN must be at least 4 characters.");return false;}
    if(p!==$("#pin2").value){alert("The two PINs do not match.");return false;}
    DB.settings.pinHash=hashPin(p);if(!saveDB())return false;}
  STAFF=true;render();return false;}
function changePin(){const o=$("#oldpin").value,n=$("#newpin").value;
  if(hashPin(o)!==DB.settings.pinHash){alert("Current PIN is wrong.");return;}
  if(n.length<4){alert("New PIN must be at least 4 characters.");return;}
  DB.settings.pinHash=hashPin(n);saveDB();flash("PIN changed.");render();}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(a,b)=>b?(100*a/b).toFixed(1)+"%":"0.0%";
const count=(arr)=>{const o={};arr.forEach(x=>{o[x]=(o[x]||0)+1});return o;};
function parseSubjects(t){const out=[];String(t||"").split(/,|;|\/|\+|&|\n|\band\b/i).forEach(p=>{
  p=p.replace(/\s+/g," ").trim().replace(/^[ .]+|[ .]+$/g,"");if(!p)return;
  const k=p.toLowerCase();const name=ALIASES[k]||p.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  if(!out.includes(name))out.push(name);});return out;}
const comboKey=c=>(String(c||"").toUpperCase().replace(/\s+/g,""))||"NOCODE";
const recNo=id=>"S4-2026-"+String(id).padStart(4,"0");
function rows(){return DB.learners.map(r=>{const o=Object.assign({},r);
  o.reason_list=r.reasons||[];o.first_subj=parseSubjects(r.first_subjects);o.alt_subj=parseSubjects(r.alt_subjects);
  o.first_key=(r.first_code||r.first_subjects)?comboKey(r.first_code):"";
  o.alt_key=(r.alt_code||r.alt_subjects)?comboKey(r.alt_code):"";
  o.status=r.followup_status||NOSTATUS;
  o.mayreturn=["Intends to return","Interested but undecided"].includes(r.return_intention);
  return o;}).sort((a,b)=>a.full_name.localeCompare(b.full_name));}

function groupCombos(rs,kind){const kf=kind+"_key",nf=kind+"_subj",m={};
  rs.forEach(r=>{const k=r[kf];if(!k)return;const g=m[k]||(m[k]={key:k,names:{},learners:[],may:0});
    if(r[nf].length){const n=r[nf].join(", ");g.names[n]=(g.names[n]||0)+1;}
    g.learners.push(r);if(r.mayreturn)g.may++;});
  return Object.values(m).map(g=>{g.code=g.key==="NOCODE"?"(no code given)":g.key;
    const e=Object.entries(g.names).sort((a,b)=>b[1]-a[1]);
    g.fullnames=e.length?e[0][0]:"(subject names not entered)";g.n=g.learners.length;return g;})
    .sort((a,b)=>b.n-a.n||a.code.localeCompare(b.code));}

function groupSubjects(rs){const m={};
  rs.forEach(r=>{r.first_subj.forEach(s=>{(m[s]=m[s]||{first:{},alt:{}}).first[r.id]=r;});
                 r.alt_subj.forEach(s=>{(m[s]=m[s]||{first:{},alt:{}}).alt[r.id]=r;});});
  return Object.entries(m).map(([name,d])=>{
    const ids=[...new Set([...Object.keys(d.first),...Object.keys(d.alt)])];
    const list=ids.map(id=>{const r=d.first[id]||d.alt[id];const inF=id in d.first,inA=id in d.alt;
      const pref=inF&&inA?"Both":inF?"First choice":"Alternative";
      let combo=inF?r.first_key:r.alt_key;if(inF&&inA&&r.alt_key!==r.first_key)combo=r.first_key+" / "+r.alt_key;
      return {r,pref,combo:combo.replace(/NOCODE/g,"-")};}).sort((a,b)=>a.r.full_name.localeCompare(b.r.full_name));
    return {name,unique:ids.length,first:Object.keys(d.first).length,alt:Object.keys(d.alt).length,
      both:ids.filter(id=>id in d.first&&id in d.alt).length,learners:list};})
    .sort((a,b)=>b.unique-a.unique||a.name.localeCompare(b.name));}

function compute(){const rs=rows(),n=rs.length,S={rows:rs,n};
  S.expected=+DB.settings.expected||0;S.target=+DB.settings.target||0;
  S.outstanding=Math.max(S.expected-n,0);S.rate=pct(n,S.expected);
  S.streams=count(rs.map(r=>r.stream));S.school=count(rs.map(r=>r.intended_school));
  S.intent=count(rs.map(r=>r.return_intention));S.status=count(rs.map(r=>r.status));
  S.discussed=count(rs.map(r=>r.discussed));
  S.first=groupCombos(rs,"first");S.alt=groupCombos(rs,"alt");S.subjects=groupSubjects(rs);
  S.reasons=count([].concat(...rs.map(r=>r.reason_list)));S.reason_base=rs.filter(r=>r.reason_list.length).length;
  const dq=[];const add=(l,a)=>{if(a.length)dq.push([l,a]);};
  add("No first-choice combination",rs.filter(r=>!r.first_key));
  add("First choice has no subject names",rs.filter(r=>r.first_key&&!r.first_subj.length));
  add("No parent/guardian phone number",rs.filter(r=>!r.parent_phone));
  add("No return intention recorded",rs.filter(r=>!r.return_intention));
  add("Q3 (intended school) and Q7 (return intention) disagree",rs.filter(r=>(r.intended_school==="Another school"&&r.return_intention==="Intends to return")||(r.intended_school===SCHOOL&&r.return_intention==="Plans to join another school")));
  add("Learner declaration not ticked",rs.filter(r=>!r.declaration));
  S.dq=dq;return S;}

/* ---------- report structure ---------- */
const tbl=(title,head,rs)=>({t:"table",title,head,rows:rs.length?rs:[["No records yet",...Array(head.length-1).fill("")]]});
const P=text=>({t:"p",text}),H=text=>({t:"h",text});
function distRows(counter,order,total){const rs=order.map(l=>[l,counter[l]||0,pct(counter[l]||0,total)]);
  const blank=Object.entries(counter).filter(([k])=>!order.includes(k)).reduce((a,[,v])=>a+v,0);
  if(blank)rs.push(["(Not answered)",blank,pct(blank,total)]);rs.push(["Total",total,total?"100.0%":"0.0%"]);return rs;}
const sortedEntries=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);

function buildParts(S,lists,contacts){const rs=S.rows,n=S.n;
  const ret=S.intent["Intends to return"]||0,und=S.intent["Interested but undecided"]||0,
        oth=S.intent["Plans to join another school"]||0,nyd=S.intent["Not yet decided"]||0;
  const parts=[];let b;
  b=[tbl("Key indicators",["Indicator","Value"],[
    ["Expected S4 learners (register)",S.expected],["Forms received",n],["Forms not yet received",S.outstanding],
    ["Form completion rate",S.rate],["Learners intending to return",`${ret} (${pct(ret,n)})`],
    ["Interested but undecided",`${und} (${pct(und,n)})`],["Planning to join another school",`${oth} (${pct(oth,n)})`],
    ["Not yet decided",`${nyd} (${pct(nyd,n)})`],["Planning target for returnees",S.target]])];
  if(n){let txt=`${n} forms have been captured out of ${S.expected} expected (${S.rate}). ${ret} learners say they intend to return and ${und} are interested but undecided, so ${ret+und} learners (${pct(ret+und,n)}) could still join A-Level here. `;
    if(S.target)txt+=`Confirmed intentions currently stand at ${ret} against a planning target of ${S.target}. `;
    if(S.first.length)txt+=`The most common first-choice combination is ${S.first[0].code} (${S.first[0].n} learners). `;
    b.push(P(txt));
    const re=sortedEntries(S.reasons);if(re.length)b.push(P(`The most frequently ticked barrier is '${re[0][0]}' (${re[0][1]} learners).`));
    b.push(P(`${(S.status["Follow-up required"]||0)+(S.status["Awaiting parent or guardian consultation"]||0)} learners are marked as needing follow-up or awaiting parent consultation.`));}
  parts.push({title:"Part I: Executive summary",blocks:b});

  b=[tbl("Forms received and outstanding",["Measure","Number"],[["Expected",S.expected],["Received",n],["Outstanding",S.outstanding],["Completion rate",S.rate]]),
     tbl("Learner distribution by stream",["Stream","Learners","Percentage"],distRows(S.streams,STREAMS,n))];
  if(S.dq.length){b.push(tbl("Missing or inconsistent information",["Issue","Learners"],S.dq.map(([l,a])=>[l,a.length])));
    if(lists)S.dq.forEach(([l,a])=>b.push(tbl(l,["Record","Name","Stream"],a.map(r=>[recNo(r.id),r.full_name,r.stream]))));}
  parts.push({title:"Part II: Participation and learner distribution",blocks:b});

  b=[tbl("Intended school for A-Level",["School","Learners","Percentage"],distRows(S.school,SCHOOL_INTENT,n)),
     tbl("First-choice combinations (ranked)",["Code","Subjects (as entered)","Learners","Percentage","May return*"],S.first.map(g=>[g.code,g.fullnames,g.n,pct(g.n,n),g.may])),
     P("*May return = learners whose return intention is 'Intends to return' or 'Interested but undecided'. Codes and subject names are exactly as written on the forms; the system does not assume a combination is offered."),
     tbl("Alternative combinations (counted separately)",["Code","Subjects (as entered)","Learners","Percentage of forms"],S.alt.map(g=>[g.code,g.fullnames,g.n,pct(g.n,n)])),
     tbl("Subject-level demand (unique learners, no double counting)",["Subject","Unique learners","First choice","Alternative","In both"],S.subjects.map(s=>[s.name,s.unique,s.first,s.alt,s.both]))];
  if(lists){b.push(H("Learners by first-choice combination"));
    S.first.forEach(g=>b.push(tbl(`${g.code}: ${g.fullnames} (${g.n} learners)`,["No.","Learner","Stream","Alternative","Return intention","Follow-up"],
      g.learners.map((r,i)=>[i+1,r.full_name,r.stream,r.alt_key.replace("NOCODE","-")||"-",r.return_intention||"-",r.status]))));
    b.push(H("Learners by individual subject (first choice, alternative or both)"));
    S.subjects.forEach(s=>b.push(tbl(`${s.name} (${s.unique} unique learners)`,["No.","Learner","Stream","Combination","Preference"],
      s.learners.map((x,i)=>[i+1,x.r.full_name,x.r.stream,x.combo,x.pref]))));}
  parts.push({title:"Part III: A-Level subject preferences",blocks:b});

  b=[tbl("Return intention",["Intention","Learners","Percentage"],distRows(S.intent,RETURN,n)),
     tbl("Reasons for possibly not returning (learners could tick more than one)",["Reason","Learners","Percentage of learners who ticked any reason"],REASONS.map(k=>[k,S.reasons[k]||0,pct(S.reasons[k]||0,S.reason_base)])),
     P(`${S.reason_base} learners ticked at least one reason, so the reason counts add up to more than that number.`)];
  const others=rs.filter(r=>r.other_reason),enc=rs.filter(r=>r.encourage);
  if(lists){if(others.length)b.push(tbl("'Other' reasons as written",["Learner","Stream","Reason"],others.map(r=>[r.full_name,r.stream,r.other_reason])));
    b.push(tbl("What could encourage learners to stay (as written, not categorised)",["Learner","Stream","Response"],enc.map(r=>[r.full_name,r.stream,r.encourage])));}
  else b.push(P(`${enc.length} written responses on what could encourage learners to stay are stored; they appear in the full report.`));
  parts.push({title:"Part IV: School retention analysis",blocks:b});

  const car=rs.filter(r=>r.career),gd=rs.filter(r=>r.guidance),cc=count(car.map(r=>r.career.trim().toLowerCase()));
  b=[P(`${car.length} learners stated a career ambition or university course; ${gd.length} asked for guidance on subject choice.`),
     tbl("Most repeated career answers (exact wording matches only)",["Career / course","Learners"],sortedEntries(cc).filter(e=>e[1]>1).slice(0,10).map(([k,v])=>[k.replace(/\b\w/g,c=>c.toUpperCase()),v]))];
  if(lists){b.push(tbl("Career ambitions",["Learner","Stream","First choice","Career / course"],car.map(r=>[r.full_name,r.stream,r.first_key.replace("NOCODE","-")||"-",r.career])));
    b.push(tbl("Learners asking for guidance",["Learner","Stream","Guidance requested"],gd.map(r=>[r.full_name,r.stream,r.guidance])));}
  parts.push({title:"Part V: Career guidance analysis",blocks:b});

  b=[tbl("Discussed A-Level plans with parent/guardian",["Answer","Learners","Percentage"],distRows(S.discussed,DISCUSSED,n))];
  if(lists)b.push(tbl("Learners who have not yet consulted a parent/guardian",["Learner","Stream","Return intention"],rs.filter(r=>["No","Not yet"].includes(r.discussed)).map(r=>[r.full_name,r.stream,r.return_intention||"-"])));
  if(contacts){b.push(P("RESTRICTED: parent telephone numbers for authorised follow-up staff only. Do not circulate."));
    b.push(tbl("Parent / guardian contacts",["Learner","Parent / guardian","Relationship","Telephone"],rs.map(r=>[r.full_name,r.parent_name,r.relationship,r.parent_phone])));}
  else b.push(P("Parent telephone numbers are not shown in this report. Authorised staff can open the report with contacts included."));
  parts.push({title:"Part VI: Parent or guardian engagement",blocks:b});

  const order=[...STATUSES,NOSTATUS];
  b=[tbl("Follow-up status",["Status","Learners","Percentage"],order.map(s=>[s,S.status[s]||0,pct(S.status[s]||0,n)])),
     tbl("Staff responsible",["Staff member","Learners assigned"],sortedEntries(count(rs.filter(r=>r.staff).map(r=>r.staff))))];
  if(lists)order.forEach(s=>{const l=rs.filter(r=>r.status===s);if(l.length)b.push(tbl(`${s} (${l.length})`,["Learner","Stream","Staff","Follow-up date","Notes"],l.map(r=>[r.full_name,r.stream,r.staff||"-",r.followup_date||"-",r.followup_notes||""])));});
  parts.push({title:"Part VII: Administrative follow-up",blocks:b});

  const rec=[];
  if(S.outstanding)rec.push(`${S.outstanding} forms are still outstanding (${pct(S.outstanding,S.expected)} of the register). Chase these before treating the figures as final.`);
  if(S.first.length)rec.push(`Highest first-choice demand: ${S.first.slice(0,3).map(g=>`${g.code} (${g.n})`).join(", ")}. Compare these with the combinations the school has approved. If a frequently chosen combination is not currently offered, administration may investigate demand, staffing, facilities and academic requirements before deciding anything.`);
  const re=sortedEntries(S.reasons);if(re.length)rec.push(`Main barriers to retention: ${re.slice(0,3).map(([k,v])=>`${k} (${v})`).join(", ")}. Plan targeted engagement for these.`);
  if(und+nyd)rec.push(`${und+nyd} learners are undecided; prioritise them for counselling and parent meetings.`);
  const nc=rs.filter(r=>["No","Not yet"].includes(r.discussed)).length;
  if(nc)rec.push(`${nc} learners have not yet discussed their plans with a parent or guardian.`);
  S.dq.forEach(([l,a])=>rec.push(`Data check: ${l} (${a.length} learners).`));
  rec.push("An intention on this form is not confirmed admission. Final placement depends on available combinations, entry requirements and academic guidance.");
  parts.push({title:"Part VIII: Draft conclusions and recommendations (for administration review)",blocks:rec.map(P)});
  return parts;}

function blocksHtml(bl){return bl.map(b=>b.t==="h"?`<h2>${esc(b.text)}</h2>`:b.t==="p"?`<p>${esc(b.text)}</p>`:
  `${b.title?`<h4>${esc(b.title)}</h4>`:""}<div class="scroll"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`).join("");}
const partsHtml=ps=>ps.map(p=>`<div class="card"><h2>${esc(p.title)}</h2>${blocksHtml(p.blocks)}</div>`).join("");
const bar=(n,t)=>`<div class="bar"><i style="width:${t?100*n/t:0}%"></i></div>`;
const opts=(arr,sel)=>arr.map(s=>`<option ${s===sel?"selected":""}>${esc(s)}</option>`).join("");
const flashMsg=(m,c)=>`<div class="flash ${c||""}">${esc(m)}</div>`;
let FLASH="";const flash=(m,c)=>{FLASH=flashMsg(m,c);};

  return `<h1>Dashboard</h1><p class="muted">Figures are calculated from the records you have entered. Register total and target are planning figures: confirm them in Settings.</p>
  <div class="grid">${[[S.expected,"Expected S4 learners"],[S.n,"Forms received"],[S.outstanding,"Not yet received"],[S.rate,"Forms received (%)"],
   [ret,"Intend to return"],[g("Interested but undecided"),"Interested but undecided"],[g("Plans to join another school"),"Joining another school"],[g("Not yet decided"),"Not yet decided"]]
   .map(([v,l])=>`<div class="k"><b>${v}</b>${l}</div>`).join("")}</div>

  const rs=rows().filter(r=>(!q||[r.full_name,recNo(r.id),r.first_code,r.alt_code].join(" ").toLowerCase().includes(q))&&

function vForm(id){const v=id?DB.learners.find(r=>r.id===+id)||{}:{};if(id&&!v.id)return `<h1>Record not found</h1>`;
  const rd=(name,arr,sel)=>arr.map(s=>`<label class="opt"><input type="radio" name="${name}" value="${esc(s)}" ${sel===s?"checked":""}>${esc(s)}</label>`).join("");

  return `<h1>${id?"Edit learner":"Add learner"}</h1>${id?`<p class="muted">Record ${recNo(v.id)} | source: ${esc(v.source||"Paper form")}</p>`:""}
  <form class="card" onsubmit="return saveLearner(event,${id?+id:0})">

  <label>Full name of learner *</label><input name="full_name" value="${esc(v.full_name)}" required>
  <div class="row"><div><label>Current Senior Four stream *</label><select name="stream" required><option value="">Select</option>${opts(STREAMS,v.stream)}</select></div>
  <div><label>Where do you intend to study A-Level?</label><select name="intended_school"><option value="">Select</option>${opts(SCHOOL_INTENT,v.intended_school)}</select></div></div>
  <h2>Section B: A-Level subject combinations</h2>
  <div class="row"><div><label>First-choice combination code</label><input name="first_code" value="${esc(v.first_code)}" placeholder="e.g. PCM"></div>
  <div><label>Full subject names (first choice)</label><input name="first_subjects" value="${esc(v.first_subjects)}" placeholder="Physics, Chemistry, Mathematics"></div></div>
  <div class="row"><div><label>Alternative combination code</label><input name="alt_code" value="${esc(v.alt_code)}"></div>
  <div><label>Full subject names (alternative)</label><input name="alt_subjects" value="${esc(v.alt_subjects)}"></div></div>
  <label>Guidance or information that would help the learner decide</label><textarea name="guidance" rows="2">${esc(v.guidance)}</textarea>

function saveLearner(e,id){e.preventDefault();const f=new FormData(e.target),g=k=>(f.get(k)||"").toString().trim();
  const d={full_name:g("full_name"),stream:g("stream"),intended_school:g("intended_school"),first_code:g("first_code").toUpperCase(),
    first_subjects:g("first_subjects"),alt_code:g("alt_code").toUpperCase(),alt_subjects:g("alt_subjects"),guidance:g("guidance"),
    return_intention:g("return_intention"),reasons:f.getAll("reasons").filter(x=>REASONS.includes(x)),other_reason:g("other_reason"),
    encourage:g("encourage"),career:g("career"),parent_name:g("parent_name"),parent_phone:g("parent_phone").replace(/[^\d+]/g,""),
    relationship:g("relationship"),discussed:g("discussed"),declaration:f.get("declaration")?1:0,declaration_date:g("declaration_date"),
    followup_status:g("followup_status"),staff:g("staff"),followup_date:g("followup_date"),followup_notes:g("followup_notes")};
  const errs=[];if(!d.full_name)errs.push("Learner's full name is required.");if(!STREAMS.includes(d.stream))errs.push("Choose the learner's stream.");
  if(d.parent_phone&&d.parent_phone.replace(/\D/g,"").length<9)errs.push("Parent telephone number looks too short.");
  if(!errs.length&&!id){const key=(d.full_name+"|"+d.stream).toLowerCase();
    const dup=DB.learners.find(r=>(r.full_name+"|"+r.stream).toLowerCase()===key);
    if(dup&&dupOK!==key){dupOK=key;errs.push(`A learner with this name and stream already exists (${recNo(dup.id)}). Press Save again to confirm it is a different learner.`);}}
  if(errs.length){window.scrollTo(0,0);const m=document.createElement("div");m.className="flash error";m.innerHTML=errs.map(esc).join("<br>");
    const old=$("#app .flash");if(old)old.remove();$("#app").prepend(m);return false;}
  if(id){Object.assign(DB.learners.find(r=>r.id===id),d);flash("Record updated.");}
  else{DB.learners.push(Object.assign({id:DB.nextId++,source:"Paper form"},d));flash(`Saved ${d.full_name}.`);}
  if(!saveDB())return false;dupOK="";location.hash=id?"#learners":"#add";if(!id)render();return false;}

function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const COLS=["record_no","full_name","stream","intended_school","first_code","first_subjects","alt_code","alt_subjects","guidance","return_intention","reasons","other_reason","encourage","career","parent_name","parent_phone","relationship","discussed","declaration","declaration_date","followup_status","staff","followup_date","followup_notes","source"];

const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{const nm=enc.encode(f.name),d=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+d.length;});
  const cdSize=cd.reduce((a,x)=>a+x.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,"");

function buildXlsx(sheets){const names=sheets.map(s=>s.name.replace(/[\[\]:*?\/\\]/g,"").slice(0,31));
  const files=[{name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
  {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
  {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${xe(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`},
  {name:"xl/_rels/workbook.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
  {name:"xl/styles.xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8F3EE"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}];
  sheets.forEach((s,si)=>{const w=s.rows[0].map((_,c)=>Math.min(50,Math.max(8,...s.rows.slice(0,200).map(r=>String(r[c]==null?"":r[c]).length))+2));
    const xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join("")}</cols><sheetData>${s.rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=colName(ci)+(ri+1),st=ri===0?' s="1"':"";

    files.push({name:`xl/worksheets/sheet${si+1}.xml`,data:xml});});
  return zipStore(files);}
function xlsxSheets(){const S=compute(),n=S.n;
  return [{name:"Learners",rows:[COLS,...S.rows.map(learnerRow)]},

  {name:"Alternative",rows:[["Code","Subjects","Learners","%"],...S.alt.map(g=>[g.code,g.fullnames,g.n,pct(g.n,n)])]},
  {name:"Subject demand",rows:[["Subject","Unique learners","First","Alternative","Both"],...S.subjects.map(s=>[s.name,s.unique,s.first,s.alt,s.both])]},

  {name:"By combination",rows:[["Combination","Subjects","Learner","Stream","Alternative","Intention","Follow-up"],...[].concat(...S.first.map(g=>g.learners.map(r=>[g.code,g.fullnames,r.full_name,r.stream,r.alt_key.replace("NOCODE","-"),r.return_intention||"",r.status])))]},
  {name:"By subject",rows:[["Subject","Learner","Stream","Combination","Preference"],...[].concat(...S.subjects.map(s=>s.learners.map(x=>[s.name,x.r.full_name,x.r.stream,x.combo,x.pref])))]},
  {name:"Follow-up",rows:[["Status","Learner","Stream","Staff","Date","Notes"],...S.rows.map(r=>[r.status,r.full_name,r.stream,r.staff||"",r.followup_date||"",r.followup_notes||""])]}];}
